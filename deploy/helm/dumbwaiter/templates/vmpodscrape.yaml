{{- with .Values.metrics.vmPodScrape }}
{{- if .enabled }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: {{ include "dumbwaiter.fullname" $ }}
  labels:
    {{- include "dumbwaiter.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "dumbwaiter.podScrapeSpec" (dict "root" $ "interval" .interval) | nindent 2 }}
{{- end }}
{{- end }}
