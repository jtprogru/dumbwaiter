{{- with .Values.metrics.podMonitor }}
{{- if .enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "dumbwaiter.fullname" $ }}
  labels:
    {{- include "dumbwaiter.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "dumbwaiter.podScrapeSpec" (dict "root" $ "interval" .interval) | nindent 2 }}
{{- end }}
{{- end }}
