{{- if and (not .Values.s3.existingSecret) (or .Values.s3.accessKeyId .Values.s3.secretAccessKey) }}
{{- if not (and .Values.s3.accessKeyId .Values.s3.secretAccessKey) }}
{{- fail "s3.accessKeyId and s3.secretAccessKey must be set together" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dumbwaiter.s3SecretName" . }}
  labels:
    {{- include "dumbwaiter.labels" . | nindent 4 }}
type: Opaque
data:
  S3_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | b64enc | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | b64enc | quote }}
{{- end }}
