{{- if .Values.networkPolicy.enabled }}
# The admin port has no authentication and exposes the configured host and
# bucket names, so in a cluster keep it reachable only for the scraper.
# Without metricsFrom no admin ingress rule is emitted. Kubelet probes from
# the pod's node are unaffected; the CNI must enforce NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dumbwaiter.fullname" . }}
  labels:
    {{- include "dumbwaiter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dumbwaiter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    {{- with .Values.networkPolicy.metricsFrom }}
    - ports:
        - port: {{ $.Values.containerPorts.admin }}
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    - ports:
        - port: {{ .Values.containerPorts.http }}
          protocol: TCP
        {{- if .Values.tls.enabled }}
        - port: {{ .Values.containerPorts.https }}
          protocol: TCP
        {{- if .Values.tls.http3 }}
        - port: {{ .Values.containerPorts.https }}
          protocol: UDP
        {{- end }}
        {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  {{- if not .Values.networkPolicy.egress.rules }}
  {{- fail "networkPolicy.egress.rules: at least one rule is required when egress is enabled" }}
  {{- end }}
  egress:
    {{- toYaml .Values.networkPolicy.egress.rules | nindent 4 }}
  {{- end }}
{{- end }}
