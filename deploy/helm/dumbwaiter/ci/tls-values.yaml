# TLS, HTTP/2 and HTTP/3 in the proxy behind a LoadBalancer, two sites with
# their own certificates and storages.
s3:
  existingSecret: dumbwaiter-s3

config:
  s3:
    endpoint: https://storage.yandexcloud.net
    region: ru-central1
    access_key_id: ${S3_ACCESS_KEY_ID}
    secret_access_key: ${S3_SECRET_ACCESS_KEY}
  sites:
    - hosts: [example.com, www.example.com]
      bucket: example-com
      not_found: 404.html
      headers:
        Strict-Transport-Security: max-age=31536000
    - hosts: [app.example.com]
      bucket: app-example-com
      prefix: dist/
      spa: true
      headers:
        Cache-Control: no-cache
      s3:
        endpoint: http://minio.storage.svc:9000
        path_style: true
        access_key_id: ${MINIO_ACCESS_KEY}
        secret_access_key: ${MINIO_SECRET_KEY}

extraEnvFrom:
  - secretRef:
      name: minio-credentials

tls:
  enabled: true
  certificates:
    - name: example-com
      secretName: example-com-tls
      dnsNames: [example.com, www.example.com]
    - name: app-example-com
      secretName: app-example-com-tls
      dnsNames: [app.example.com]
      issuerRef:
        kind: Issuer
        name: internal-ca
  service:
    annotations:
      metallb.universe.tf/allow-shared-ip: dumbwaiter
    loadBalancerSourceRanges: [0.0.0.0/0]

autoscaling:
  enabled: true
  targetMemoryUtilizationPercentage: 80
