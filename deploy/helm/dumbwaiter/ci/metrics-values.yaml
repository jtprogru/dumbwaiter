# Every way to get the proxy scraped at once.
s3:
  existingSecret: dumbwaiter-s3

metrics:
  scrapeAnnotations: true
  podMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  vmPodScrape:
    enabled: true

# Discovery alone does not grant network access to the admin listener.
networkPolicy:
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
