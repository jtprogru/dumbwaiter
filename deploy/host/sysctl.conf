# /etc/sysctl.d/90-dumbwaiter.conf, applied with sysctl --system.
#
# quic-go, behind HTTP/3 in dumbwaiter and in Caddy, wants about 7 MB UDP
# buffers and warns at startup without them. HTTP/3 works either way, only
# slower on fast links. These are host-wide settings: a container cannot
# raise them for itself.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
