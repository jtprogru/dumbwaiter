# dumbwaiter terminates TLS itself (compose.tls.yaml). Certificates live in
# ./certs/<name>/tls.crt and tls.key and must be readable by uid or gid 65532.
# Full reference: config.example.yaml in the repository root.
server:
  http:
    redirect_to_https: true
  https:
    # The port clients see: compose publishes 443 to 8443 in the container.
    public_port: 443
    http3: true
    certificates:
      - cert: /etc/tls/example.com/tls.crt
        key: /etc/tls/example.com/tls.key
  # How long to keep serving after SIGTERM. A single host has no load
  # balancer to wait for, the default 5s only slows down restarts.
  shutdown_delay: 1s

s3:
  endpoint: https://storage.yandexcloud.net
  region: ru-central1
  access_key_id: ${S3_ACCESS_KEY_ID}
  secret_access_key: ${S3_SECRET_ACCESS_KEY}

sites:
  - hosts: [example.com, www.example.com]
    bucket: example-com
    not_found: 404.html
    headers:
      Strict-Transport-Security: max-age=31536000
