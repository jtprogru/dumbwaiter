# TLS ends on Ingress or Gateway, the proxy speaks plain HTTP.
# Full reference: config.example.yaml in the repository root.
s3:
  endpoint: https://storage.yandexcloud.net
  region: ru-central1
  access_key_id: ${S3_ACCESS_KEY_ID}
  secret_access_key: ${S3_SECRET_ACCESS_KEY}

sites:
  - hosts: [example.com, www.example.com]
    bucket: example-com
    not_found: 404.html
