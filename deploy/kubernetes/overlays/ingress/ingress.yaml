apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dumbwaiter
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [example.com, www.example.com]
      secretName: example-com-tls
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dumbwaiter
                port:
                  name: http
    - host: www.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dumbwaiter
                port:
                  name: http
