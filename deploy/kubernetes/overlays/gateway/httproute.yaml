apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dumbwaiter
spec:
  # An existing Gateway with an HTTPS listener for these hosts.
  parentRefs:
    - name: public
      namespace: gateway-system
  hostnames:
    - example.com
    - www.example.com
  rules:
    - backendRefs:
        - name: dumbwaiter
          port: 80
