global:
  scrape_interval: 15s
  scrape_timeout: 10s
scrape_configs:
  - job_name: dumbwaiter
    static_configs:
      - targets: [dumbwaiter:9090]
  - job_name: known-object
    metrics_path: /probe
    params: {module: [known_object]}
    static_configs:
      - targets: [http://dumbwaiter:8080/probe.txt]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: victoriametrics
    static_configs:
      - targets: [victoriametrics:8428]
  - job_name: vmagent
    static_configs:
      - targets: [vmagent:8429]
  - job_name: vmalert
    static_configs:
      - targets: [vmalert:8880]
  - job_name: victorialogs
    static_configs:
      - targets: [victorialogs:9428]
  - job_name: vector
    static_configs:
      - targets: [vector:9598]
  - job_name: blackbox
    static_configs:
      - targets: [blackbox:9115]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
