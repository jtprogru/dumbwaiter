# /etc/dumbwaiter/config.yaml for dumbwaiter.service. dumbwaiter listens on
# 80 and 443 itself and terminates TLS with certificates from certbot, see
# deploy/host/certbot-deploy-hook.sh. Full reference: config.example.yaml in
# the repository root.
#
# Behind nginx or Caddy on the same host instead: delete server.https and
# redirect_to_https, and set server.http.addr to 127.0.0.1:8080.
server:
  http:
    addr: ":80"
    redirect_to_https: true
  https:
    addr: ":443"
    public_port: 443
    http3: true
    # Written by the certbot deploy hook. Reread every reload_interval, so a
    # renewal applies without a restart.
    certificates:
      - cert: /etc/dumbwaiter/tls/example.com/tls.crt
        key: /etc/dumbwaiter/tls/example.com/tls.key
  # Health probes, for the host only.
  admin:
    addr: "127.0.0.1:9090"
  # How long to keep serving after SIGTERM. A single host has no load
  # balancer to wait for, the default 5s only slows down restarts.
  shutdown_delay: 1s

s3:
  endpoint: https://storage.yandexcloud.net
  region: ru-central1
  access_key_id: ${S3_ACCESS_KEY_ID}
  secret_access_key: ${S3_SECRET_ACCESS_KEY}

sites:
  - hosts: [example.com, www.example.com]
    bucket: example-com
    not_found: 404.html
    headers:
      Strict-Transport-Security: max-age=31536000
