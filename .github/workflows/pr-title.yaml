# The PR title becomes the commit on main with squash merge, and the release
# changelog is grouped by its Conventional Commits type.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-commit:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" of "{title}" has to start with a lowercase
            letter and must not end with a period, e.g. "feat(s3): add retries".

      # Dependabot titles carry two version numbers and may run longer.
      - name: Title length
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::The title is ${#TITLE} characters long, keep it within 72"
            exit 1
          fi
